{{- $repo := required "image.repository is required" .Values.image.repository -}}
{{- $image := "" -}}
{{- if .Values.image.digest -}}
{{- $image = printf "%s@%s" $repo .Values.image.digest -}}
{{- else -}}
{{- $tag := required "provide image.digest (recommended) or a versioned image.tag" .Values.image.tag -}}
{{- if eq $tag "latest" -}}{{ fail "image.tag=latest is not a release version; use a digest or versioned tag" }}{{- end -}}
{{- $image = printf "%s:%s" $repo $tag -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: {{ $image | quote }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.secretName }}
          envFrom:
            - secretRef: {name: {{ .Values.secretName | quote }}}
          {{- end }}
          startupProbe:
            httpGet: {path: {{ .Values.healthPath | quote }}, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ .Values.healthPath | quote }}, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  ports:
    - {name: http, port: {{ .Values.port }}, targetPort: http}
