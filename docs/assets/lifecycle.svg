<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Keep the workspace. Release the artifact."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#87e4c8"/></marker></defs><rect width="1200" height="650" rx="22" fill="#0d171d"/><g font-family="system-ui, sans-serif"><text x="48" y="64" fill="#87e4c8" font-size="13" letter-spacing="3">BENCHYARD / COMPOSABLE TOOLS</text><text x="48" y="118" fill="#e9f2f5" font-size="37" font-weight="650">Keep the workspace. Release the artifact.</text><text x="48" y="154" fill="#a4bec9" font-size="17">Three lifetimes, with an explicit review between mutable source and a deployed image.</text><rect x="48" y="230" width="330" height="230" rx="12" fill="#14252e" stroke="#35535e"/><rect x="48" y="248" width="4" height="28" fill="#87e4c8"/><text x="72" y="270" fill="#87e4c8" font-size="23" font-weight="600">DEVELOP</text><text x="72" y="302" fill="#a4bec9" font-size="16">Persistent source on a PVC</text><text x="72" y="327" fill="#a4bec9" font-size="16">Agent edits uncommitted files</text><text x="72" y="352" fill="#a4bec9" font-size="16">Dev server watches for changes</text><text x="72" y="377" fill="#a4bec9" font-size="16">Browser previews over HTTP/WS</text><text x="72" y="402" fill="#a4bec9" font-size="16">Multiple turns, one workspace</text><rect x="435" y="230" width="330" height="230" rx="12" fill="#14252e" stroke="#35535e"/><rect x="435" y="248" width="4" height="28" fill="#a9c8ff"/><text x="459" y="270" fill="#a9c8ff" font-size="23" font-weight="600">REVIEW</text><text x="459" y="302" fill="#a4bec9" font-size="16">Run explicit acceptance checks</text><text x="459" y="327" fill="#a4bec9" font-size="16">Inspect expected / actual results</text><text x="459" y="352" fill="#a4bec9" font-size="16">Record the reviewed revision</text><text x="459" y="377" fill="#a4bec9" font-size="16">Attach Argos evidence</text><text x="459" y="402" fill="#a4bec9" font-size="16">Live previews remain mutable</text><rect x="822" y="230" width="330" height="230" rx="12" fill="#14252e" stroke="#35535e"/><rect x="822" y="248" width="4" height="28" fill="#87e4c8"/><text x="846" y="270" fill="#87e4c8" font-size="23" font-weight="600">RELEASE</text><text x="846" y="302" fill="#a4bec9" font-size="16">Build the reviewed source</text><text x="846" y="327" fill="#a4bec9" font-size="16">Record the image digest</text><text x="846" y="352" fill="#a4bec9" font-size="16">Deploy staging, then production</text><text x="846" y="377" fill="#a4bec9" font-size="16">Readiness-gated rollout</text><text x="846" y="402" fill="#a4bec9" font-size="16">No live source PVC attached</text><path d="M383 345 L430 345" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M770 345 L817 345" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="48" y="540" fill="#87e4c8" font-size="19">A finished agent turn is not a reason to delete the task workspace.</text><text x="48" y="580" fill="#a4bec9" font-size="16">Pod replacement preserves files; processes restart. Retention is not a backup policy.</text></g></svg>